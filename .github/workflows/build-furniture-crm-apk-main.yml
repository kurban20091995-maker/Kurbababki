name: Build Master Object All Dates APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-furniture-crm-apk-main.yml'
  workflow_dispatch:

jobs:
  date-audit-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: furniture-crm-android-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct verified Master Object base
        run: |
          cat \
            .masterobject-v2/part00 \
            .masterobject-v2/part01 \
            .masterobject-v2/part02 \
            .masterobject-v2/part03a \
            .masterobject-v3/part03b \
            .masterobject-v2/part04 \
            .masterobject-v2/part05 \
            .masterobject-v3/part06a \
            .masterobject-v3/part06b0 \
            .masterobject-v3/part06b1 \
            .masterobject-v3/part06b2 \
            .masterobject-v3/part06b3 \
            .masterobject-v3/part070 \
            .masterobject-v3/part071 \
            .masterobject-v3/part072 \
            .masterobject-v3/part073 \
            .masterobject-v3/part074 \
            .masterobject-v3/part075 > masterobject.b64
          test "$(wc -c < masterobject.b64)" -eq 61464
          echo '5481be78077523c8863519decdeac2bf342a943bef3f9404d0bffc9b2abf0ee4  masterobject.b64' | sha256sum -c -
          base64 --decode masterobject.b64 > MasterObject-Android.zip
          echo '6a9a916cfcc886eaad66036d29a96bfc8128ed50b5b554c6cd256e0fc63fa298  MasterObject-Android.zip' | sha256sum -c -
          unzip -t MasterObject-Android.zip
          rm -rf build-src
          mkdir build-src
          unzip -q MasterObject-Android.zip -d build-src

      - name: Reconstruct verified audit patch
        run: |
          cat \
            .masterobject-audit/first0 \
            .masterobject-audit/first1 \
            .masterobject-audit/big00 \
            .masterobject-audit/big01 \
            .masterobject-audit/big02 \
            .masterobject-audit/big03 > /tmp/masterobject-audit.patch
          test "$(wc -c < /tmp/masterobject-audit.patch)" -eq 57527
          echo '836117787d481196d93989f0f5df33821a947deb482b6f98ca00d0c60a96521d  /tmp/masterobject-audit.patch' | sha256sum -c -

      - name: Apply audit optimizations
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: patch -p1 < /tmp/masterobject-audit.patch

      - name: Reconstruct verified all-date patch
        run: |
          head -c 9000 .masterobject-dates/part00 > /tmp/masterobject-dates.patch
          cat \
            .masterobject-dates/part01 \
            .masterobject-dates/part02 \
            .masterobject-dates/part03 \
            .masterobject-dates/part04 \
            .masterobject-dates/part05 \
            .masterobject-dates/part06 >> /tmp/masterobject-dates.patch
          test "$(wc -c < /tmp/masterobject-dates.patch)" -eq 58898
          echo 'baff40e9517ae68df7fe1f80db5cb317e8cbf75362169eaa2497f6e71fe3c00f  /tmp/masterobject-dates.patch' | sha256sum -c -

      - name: Apply all date fixes
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: patch -p1 < /tmp/masterobject-dates.patch

      - name: Verify final source configuration
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: |
          grep -F 'applicationId = "ru.masterobject.stable"' app/build.gradle.kts
          grep -F 'versionCode = 200' app/build.gradle.kts
          grep -F 'versionName = "2.2.0"' app/build.gradle.kts
          grep -F 'const val ZONE_ID = "Europe/Moscow"' app/src/main/java/ru/furniturecrm/app/BusinessTime.kt
          grep -F 'SQLiteOpenHelper(context, "furniture_crm.db", null, 3)' app/src/main/java/ru/furniturecrm/app/Database.kt
          if grep -R 'LocalDate.now()' app/src/main/java/ru/furniturecrm/app --exclude=BusinessTime.kt; then
            echo 'Direct LocalDate.now() remains outside BusinessTime' >&2
            exit 1
          fi

      - name: Run date and unit tests
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Run Android Lint
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Build APK
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare final APK
        run: cp build-src/FurnitureInstallerCRM-Android/app/build/outputs/apk/debug/app-debug.apk MasterObject-AllDates.apk

      - name: Verify APK signature identity and version
        run: |
          test -s MasterObject-AllDates.apk
          file MasterObject-AllDates.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs MasterObject-AllDates.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging MasterObject-AllDates.apk | tee /tmp/badging.txt
          grep -F "package: name='ru.masterobject.stable' versionCode='200' versionName='2.2.0'" /tmp/badging.txt
          sha256sum MasterObject-AllDates.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterObject-AllDates-APK
          path: MasterObject-AllDates.apk
          if-no-files-found: error
