name: Build Master Object RuStore Paywall

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-furniture-crm-apk-main.yml'
  workflow_dispatch:

jobs:
  rustore-paywall-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: furniture-crm-android-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct verified Master Object base
        run: |
          cat \
            .masterobject-v2/part00 \
            .masterobject-v2/part01 \
            .masterobject-v2/part02 \
            .masterobject-v2/part03a \
            .masterobject-v3/part03b \
            .masterobject-v2/part04 \
            .masterobject-v2/part05 \
            .masterobject-v3/part06a \
            .masterobject-v3/part06b0 \
            .masterobject-v3/part06b1 \
            .masterobject-v3/part06b2 \
            .masterobject-v3/part06b3 \
            .masterobject-v3/part070 \
            .masterobject-v3/part071 \
            .masterobject-v3/part072 \
            .masterobject-v3/part073 \
            .masterobject-v3/part074 \
            .masterobject-v3/part075 > masterobject.b64
          test "$(wc -c < masterobject.b64)" -eq 61464
          echo '5481be78077523c8863519decdeac2bf342a943bef3f9404d0bffc9b2abf0ee4  masterobject.b64' | sha256sum -c -
          base64 --decode masterobject.b64 > MasterObject-Android.zip
          echo '6a9a916cfcc886eaad66036d29a96bfc8128ed50b5b554c6cd256e0fc63fa298  MasterObject-Android.zip' | sha256sum -c -
          rm -rf build-src
          mkdir build-src
          unzip -q MasterObject-Android.zip -d build-src

      - name: Apply verified audit patch
        run: |
          cat \
            .masterobject-audit/first0 \
            .masterobject-audit/first1 \
            .masterobject-audit/big00 \
            .masterobject-audit/big01 \
            .masterobject-audit/big02 \
            .masterobject-audit/big03 > /tmp/masterobject-audit.patch
          echo '836117787d481196d93989f0f5df33821a947deb482b6f98ca00d0c60a96521d  /tmp/masterobject-audit.patch' | sha256sum -c -
          cd build-src/FurnitureInstallerCRM-Android
          patch -p1 < /tmp/masterobject-audit.patch

      - name: Apply verified CalendarFix source patch
        run: |
          : > /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part00 >> /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part01 >> /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part02 >> /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part03 >> /tmp/calendar.b64
          head -c 20 .masterobject-calendar/part04 >> /tmp/calendar.b64
          echo 'd01526a39d9a8db200971423b0e4b66ea98f86c71d0fcd1a65ebc66e2a82f112  /tmp/calendar.b64' | sha256sum -c -
          base64 --decode /tmp/calendar.b64 | gunzip > /tmp/masterobject-calendar.patch
          echo '63ace970c3cdfa1d846f51709c3d90a3cf28cd29b3989e0bb798495c7b41a320  /tmp/masterobject-calendar.patch' | sha256sum -c -
          cd build-src/FurnitureInstallerCRM-Android
          patch -p2 < /tmp/masterobject-calendar.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ru/furniturecrm/app/Repository.kt')
          s = p.read_text()
          old = '            arrayOf(\n                if (c.isNull(0)) null else c.getString(0),\n                if (c.isNull(1)) null else c.getInt(1),'
          new = '            arrayOf<Any?>(\n                if (c.isNull(0)) null else c.getString(0),\n                if (c.isNull(1)) null else c.getInt(1),'
          if old not in s:
              raise SystemExit('CalendarFix type hotfix target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply phone-calendar and duration fix
        run: |
          cat .masterobject-phonecalendar/part00 .masterobject-phonecalendar/part01 > /tmp/phonecalendar.b64
          test "$(wc -c < /tmp/phonecalendar.b64)" -eq 10332
          echo '5cc495699ce2489f4a5ac84e22b0f6c97b33e130bf8c5dcff40580aaafd693d4  /tmp/phonecalendar.b64' | sha256sum -c -
          base64 --decode /tmp/phonecalendar.b64 | gunzip > /tmp/phonecalendar.patch
          echo '0a4f4e0e1f19cc62a1f1c12c10b6fb4617dba21d45c480956a4122dc62f73378  /tmp/phonecalendar.patch' | sha256sum -c -
          cd build-src/FurnitureInstallerCRM-Android
          patch -p2 < /tmp/phonecalendar.patch

      - name: Align one-off day-off regression with phone calendar
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: |
          TEST=app/src/test/java/ru/furniturecrm/app/SchedulerTest.kt
          sed -i 's/plannedStart=LocalDate.of(2026,9,5),durationHalfDays=4/plannedStart=LocalDate.of(2026,9,6),durationHalfDays=4/' "$TEST"
          sed -i 's/workDays,exceptions,LocalDate.of(2026,9,5),0/workDays,exceptions,LocalDate.of(2026,9,6),0/' "$TEST"
          sed -i '0,/assertEquals(LocalDate.of(2026,9,5),item.startDate)/s//assertEquals(LocalDate.of(2026,9,6),item.startDate)/' "$TEST"

      - name: Apply RuStore staged source files
        run: |
          ROOT=build-src/FurnitureInstallerCRM-Android
          cp .masterobject-rustore/files/settings.gradle.kts "$ROOT/settings.gradle.kts"
          cp .masterobject-rustore/files/app-build.gradle.kts "$ROOT/app/build.gradle.kts"
          cp .masterobject-rustore/files/AndroidManifest.xml "$ROOT/app/src/main/AndroidManifest.xml"
          cp .masterobject-rustore/files/MainActivity.kt "$ROOT/app/src/main/java/ru/furniturecrm/app/MainActivity.kt"
          cp .masterobject-rustore/files/LicensePolicy.kt "$ROOT/app/src/main/java/ru/furniturecrm/app/LicensePolicy.kt"
          cp .masterobject-rustore/files/LicenseUi.kt "$ROOT/app/src/main/java/ru/furniturecrm/app/LicenseUi.kt"
          cp .masterobject-rustore/files/RuStoreLicenseManager.kt "$ROOT/app/src/main/java/ru/furniturecrm/app/RuStoreLicenseManager.kt"
          cp .masterobject-rustore/files/LicensePolicyTest.kt "$ROOT/app/src/test/java/ru/furniturecrm/app/LicensePolicyTest.kt"

      - name: Wire paywall into Compose root
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ru/furniturecrm/app/CrmApp.kt')
          s = p.read_text()
          replacements = [
              ('fun FurnitureCrmApp(vm: AppViewModel, initialProjectId: Long? = null) {\n    val state by vm.state.collectAsState()\n', 'fun FurnitureCrmApp(vm: AppViewModel, licenseManager: RuStoreLicenseManager, initialProjectId: Long? = null) {\n    val state by vm.state.collectAsState()\n    val license by licenseManager.state.collectAsState()\n'),
              ('            when {\n                creating || editId != null -> {', '            when {\n                !license.canUseApp -> LicensePaywallScreen(\n                    license = license,\n                    vm = vm,\n                    onBuy = licenseManager::purchase,\n                    onRestore = { licenseManager.refreshPurchases(silent = false) },\n                )\n                creating || editId != null -> {'),
              ('                            MainScreen.HOME -> DashboardScreen(state, onProject = { detailId = it }, onAdd = { creating = true }, onQueue = { screenName = MainScreen.QUEUE.name })', '                            MainScreen.HOME -> DashboardScreen(state, license, onBuy = licenseManager::purchase, onProject = { detailId = it }, onAdd = { creating = true }, onQueue = { screenName = MainScreen.QUEUE.name })'),
              ('private fun DashboardScreen(state: AppUiState, onProject: (Long) -> Unit, onAdd: () -> Unit, onQueue: () -> Unit) {', 'private fun DashboardScreen(state: AppUiState, license: LicenseUiState, onBuy: () -> Unit, onProject: (Long) -> Unit, onAdd: () -> Unit, onQueue: () -> Unit) {'),
              ('            Text("Сегодня ${BusinessTime.today().format(RuFullDate)} • календарь телефона • ${BusinessTime.zoneLabel()}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n        }\n        item {', '            Text("Сегодня ${BusinessTime.today().format(RuFullDate)} • календарь телефона • ${BusinessTime.zoneLabel()}", style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n        }\n        if (license.isTrial) {\n            item { TrialAccessBanner(license = license, onBuy = onBuy) }\n        }\n        item {'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('CrmApp paywall target not found: ' + old[:80])
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify paywall source invariants
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: |
          grep -F 'applicationId = "ru.masterobject.app"' app/build.gradle.kts
          grep -F 'versionCode = 1' app/build.gradle.kts
          grep -F 'versionName = "1.0.0"' app/build.gradle.kts
          grep -F 'const val TRIAL_DAYS: Long = 3' app/src/main/java/ru/furniturecrm/app/LicensePolicy.kt
          grep -F 'priceLabel = "199 ₽"' app/src/main/java/ru/furniturecrm/app/RuStoreLicenseManager.kt
          grep -F 'implementation("ru.rustore.sdk:pay")' app/build.gradle.kts
          grep -F 'master_object_full_199' app/build.gradle.kts
          grep -F 'ENFORCE_PAYWALL' app/build.gradle.kts
          grep -F 'Восстановить покупку' app/src/main/java/ru/furniturecrm/app/LicenseUi.kt
          grep -F 'Экспортировать свои данные' app/src/main/java/ru/furniturecrm/app/LicenseUi.kt
          grep -F 'fun FurnitureCrmApp(vm: AppViewModel, licenseManager: RuStoreLicenseManager' app/src/main/java/ru/furniturecrm/app/CrmApp.kt
          grep -F 'ZoneId.systemDefault()' app/src/main/java/ru/furniturecrm/app/BusinessTime.kt

      - name: Run all unit tests including license policy
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Inspect RuStore Pay SDK on compile failure
        if: failure()
        run: |
          echo '--- RuStore SDK cache ---'
          find ~/.gradle/caches/modules-2/files-2.1/ru.rustore.sdk -type f 2>/dev/null | sort | tail -120 || true
          AAR=$(find ~/.gradle/caches/modules-2/files-2.1/ru.rustore.sdk -name '*.aar' 2>/dev/null | grep '/pay/' | head -1 || true)
          if [ -n "$AAR" ]; then
            echo "Inspecting $AAR"
            unzip -p "$AAR" classes.jar > /tmp/rustore-pay-classes.jar
            jar tf /tmp/rustore-pay-classes.jar | grep -E 'RuStorePayClient|ProductPurchase|ProductType|ProductId|PreferredPurchaseType|PurchaseInteractor|IntentInteractor' | head -250 || true
            javap -classpath /tmp/rustore-pay-classes.jar ru.rustore.sdk.pay.PurchaseInteractor 2>/dev/null | head -120 || true
            javap -classpath /tmp/rustore-pay-classes.jar ru.rustore.sdk.pay.model.ProductPurchase 2>/dev/null | head -100 || true
          fi

      - name: Run Android Lint
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Build RuStore preview APK
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare preview APK
        run: cp build-src/FurnitureInstallerCRM-Android/app/build/outputs/apk/debug/app-debug.apk MasterObject-RuStore-Preview.apk

      - name: Verify preview APK
        run: |
          test -s MasterObject-RuStore-Preview.apk
          file MasterObject-RuStore-Preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs MasterObject-RuStore-Preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging MasterObject-RuStore-Preview.apk | tee /tmp/badging.txt
          grep -F "package: name='ru.masterobject.app' versionCode='1' versionName='1.0.0'" /tmp/badging.txt
          sha256sum MasterObject-RuStore-Preview.apk

      - name: Upload paywall source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: MasterObject-RuStore-Source
          path: build-src/FurnitureInstallerCRM-Android
          if-no-files-found: error

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterObject-RuStore-Preview-APK
          path: MasterObject-RuStore-Preview.apk
          if-no-files-found: error
