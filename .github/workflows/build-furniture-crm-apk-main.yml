name: Build Furniture CRM APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-furniture-crm-apk-main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android CRM branch
        uses: actions/checkout@v4
        with:
          ref: furniture-crm-android-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct and patch Android project
        run: |
          cat .apkbuild/chunk00a .apkbuild/chunk00b .apkbuild/part00 .apkbuild/part01 .apkbuild/part02 .apkbuild/part03 .apkbuild/part04 > furniture-crm-android.raw.b64
          tr -cd 'A-Za-z0-9+/=' < furniture-crm-android.raw.b64 > furniture-crm-android.b64
          test "$(wc -c < furniture-crm-android.b64)" -eq 52276
          echo '475ec12e165b7b6f6239f5a43c10eb42d5fbf9fb0a193b9cfe51c699c59617ce  furniture-crm-android.b64' | sha256sum -c -
          base64 --decode furniture-crm-android.b64 > furniture-crm-android-rebuilt.zip
          echo 'e34540d11955faf82549a750e7ed950c081a5175a6195db0c2c38bbf94931898  furniture-crm-android-rebuilt.zip' | sha256sum -c -
          unzip -t furniture-crm-android-rebuilt.zip
          rm -rf build-src
          mkdir build-src
          unzip -q furniture-crm-android-rebuilt.zip -d build-src
          APP=build-src/FurnitureInstallerCRM-Android/app
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$APP/build.gradle.kts"
          sed -i 's/targetSdk = 37/targetSdk = 36/' "$APP/build.gradle.kts"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.06.01/' "$APP/build.gradle.kts"
          sed -i '1i@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n' "$APP/src/main/java/ru/furniturecrm/app/CrmApp.kt"
          echo 'Patched SDK, Compose BOM and Material3 opt-in.'

      - name: Build debug APK
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureInstallerCRM-APK
          path: build-src/FurnitureInstallerCRM-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
