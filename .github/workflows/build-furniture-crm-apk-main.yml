name: Export CalendarFix Source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-furniture-crm-apk-main.yml'
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: furniture-crm-android-build

      - name: Reconstruct verified Master Object base
        run: |
          cat \
            .masterobject-v2/part00 \
            .masterobject-v2/part01 \
            .masterobject-v2/part02 \
            .masterobject-v2/part03a \
            .masterobject-v3/part03b \
            .masterobject-v2/part04 \
            .masterobject-v2/part05 \
            .masterobject-v3/part06a \
            .masterobject-v3/part06b0 \
            .masterobject-v3/part06b1 \
            .masterobject-v3/part06b2 \
            .masterobject-v3/part06b3 \
            .masterobject-v3/part070 \
            .masterobject-v3/part071 \
            .masterobject-v3/part072 \
            .masterobject-v3/part073 \
            .masterobject-v3/part074 \
            .masterobject-v3/part075 > masterobject.b64
          test "$(wc -c < masterobject.b64)" -eq 61464
          echo '5481be78077523c8863519decdeac2bf342a943bef3f9404d0bffc9b2abf0ee4  masterobject.b64' | sha256sum -c -
          base64 --decode masterobject.b64 > MasterObject-Android.zip
          echo '6a9a916cfcc886eaad66036d29a96bfc8128ed50b5b554c6cd256e0fc63fa298  MasterObject-Android.zip' | sha256sum -c -
          rm -rf build-src
          mkdir build-src
          unzip -q MasterObject-Android.zip -d build-src

      - name: Apply verified audit patch
        run: |
          cat \
            .masterobject-audit/first0 \
            .masterobject-audit/first1 \
            .masterobject-audit/big00 \
            .masterobject-audit/big01 \
            .masterobject-audit/big02 \
            .masterobject-audit/big03 > /tmp/masterobject-audit.patch
          echo '836117787d481196d93989f0f5df33821a947deb482b6f98ca00d0c60a96521d  /tmp/masterobject-audit.patch' | sha256sum -c -
          cd build-src/FurnitureInstallerCRM-Android
          patch -p1 < /tmp/masterobject-audit.patch

      - name: Apply verified calendar patch
        run: |
          : > /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part00 >> /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part01 >> /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part02 >> /tmp/calendar.b64
          head -c 7200 .masterobject-calendar/part03 >> /tmp/calendar.b64
          head -c 20 .masterobject-calendar/part04 >> /tmp/calendar.b64
          echo 'd01526a39d9a8db200971423b0e4b66ea98f86c71d0fcd1a65ebc66e2a82f112  /tmp/calendar.b64' | sha256sum -c -
          base64 --decode /tmp/calendar.b64 | gunzip > /tmp/masterobject-calendar.patch
          echo '63ace970c3cdfa1d846f51709c3d90a3cf28cd29b3989e0bb798495c7b41a320  /tmp/masterobject-calendar.patch' | sha256sum -c -
          cd build-src/FurnitureInstallerCRM-Android
          patch -p2 < /tmp/masterobject-calendar.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ru/furniturecrm/app/Repository.kt')
          s = p.read_text()
          old = '''            arrayOf(\n                if (c.isNull(0)) null else c.getString(0),\n                if (c.isNull(1)) null else c.getInt(1),'''
          new = '''            arrayOf<Any?>(\n                if (c.isNull(0)) null else c.getString(0),\n                if (c.isNull(1)) null else c.getInt(1),'''
          if old not in s:
              raise SystemExit('hotfix target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Archive exact source
        run: |
          cd build-src
          zip -qr ../MasterObject-CalendarFix-Source.zip FurnitureInstallerCRM-Android
          sha256sum ../MasterObject-CalendarFix-Source.zip

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: MasterObject-CalendarFix-Source
          path: MasterObject-CalendarFix-Source.zip
          if-no-files-found: error
