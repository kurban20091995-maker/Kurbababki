name: Build Furniture CRM APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-furniture-crm-apk-main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android CRM branch
        uses: actions/checkout@v4
        with:
          ref: furniture-crm-android-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unpack Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q furniture-crm-android.zip -d build-src
          sed -i 's/compileSdk = 37/compileSdk = 36/' build-src/FurnitureInstallerCRM-Android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' build-src/FurnitureInstallerCRM-Android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureInstallerCRM-APK
          path: build-src/FurnitureInstallerCRM-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# build-retry: corrected-binary-archive
