name: Build Master Object APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-furniture-crm-apk-main.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android CRM branch
        uses: actions/checkout@v4
        with:
          ref: furniture-crm-android-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Reconstruct Master Object project
        run: |
          cat .masterobject-v2/part00 .masterobject-v2/part01 .masterobject-v2/part02 .masterobject-v2/part03 .masterobject-v2/part04 .masterobject-v2/part05 .masterobject-v2/part06 .masterobject-v2/part07 > masterobject.raw.b64
          tr -cd 'A-Za-z0-9+/=' < masterobject.raw.b64 > masterobject.b64
          echo "Clean Base64 size: $(wc -c < masterobject.b64)"
          test "$(wc -c < masterobject.b64)" -eq 61464
          echo 'eca53c315198510a55ead79176b996711096a2d7ba9d083c53a3faa773f2ddc8  masterobject.b64' | sha256sum -c -
          base64 --decode masterobject.b64 > MasterObject-Android.zip
          echo '8a955e97ff63f2e804ff68c1a37eb19de99299b11c6fab1335a2dd4231c59ca6  MasterObject-Android.zip' | sha256sum -c -
          unzip -t MasterObject-Android.zip
          rm -rf build-src
          mkdir build-src
          unzip -q MasterObject-Android.zip -d build-src

      - name: Run unit tests
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: cp build-src/FurnitureInstallerCRM-Android/app/build/outputs/apk/debug/app-debug.apk MasterObject.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterObject-APK
          path: MasterObject.apk
          if-no-files-found: error
