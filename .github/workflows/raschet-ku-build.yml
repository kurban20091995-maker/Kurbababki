name: Build Raschet KU APK

on:
  push:
    branches: [ "tmp-raschet-ku-build" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare launcher icons from supplied image
        run: |
          set -euxo pipefail
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y imagemagick; }
          test -s raschet-ku/icon-source.webp
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"; size="${spec##*:}"
            mkdir -p "raschet-ku/app/src/main/res/mipmap-${density}"
            convert raschet-ku/icon-source.webp -resize "${size}x${size}" "raschet-ku/app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
          file raschet-ku/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Verify formulas
        run: |
          python3 - <<'PY'
          import math
          C=90.0; S=45.0
          m=math.degrees(math.atan(math.sin(math.radians(S))/math.tan(math.radians(C)/2)))
          b=math.degrees(math.asin(math.cos(math.radians(S))*math.cos(math.radians(C)/2)))
          hp=math.degrees(math.atan(100/100))
          lp=math.degrees(math.asin(100/141.42))
          print('90/45 miter/bevel:', m, b)
          print('H+P:', hp, 'L+P:', lp)
          assert abs(m-35.26438968) < 0.001
          assert abs(b-30.0) < 0.001
          assert abs(hp-45.0) < 0.001
          assert abs(lp-45.00054948) < 0.01
          PY

      - name: Build APK
        working-directory: raschet-ku
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK structure, metadata, permissions, alignment and signature
        run: |
          set -euxo pipefail
          APK="$GITHUB_WORKSPACE/raschet-ku/app/build/outputs/apk/debug/app-debug.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          "$BT/aapt2" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='ru.raschet.ku'" /tmp/badging.txt
          grep -Fq "application-label:'Расчет к.у.'" /tmp/badging.txt
          grep -q 'application-icon-' /tmp/badging.txt
          "$BT/aapt2" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -Eq 'CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|INTERNET' /tmp/permissions.txt; then
            echo 'Unexpected permission found'; exit 1
          fi
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install "$GITHUB_WORKSPACE/raschet-ku/app/build/outputs/apk/debug/app-debug.apk"
            adb shell pm path ru.raschet.ku
            adb shell am force-stop ru.raschet.ku
            adb shell am start -W -n ru.raschet.ku/.MainActivity > /tmp/launch.txt
            cat /tmp/launch.txt
            grep -q 'Status: ok' /tmp/launch.txt
            sleep 2
            adb shell dumpsys activity activities | grep 'ru.raschet.ku' > /tmp/activity.txt
            cat /tmp/activity.txt
            test -s /tmp/activity.txt

      - name: Copy final APK
        run: cp raschet-ku/app/build/outputs/apk/debug/app-debug.apk 'Raschet-KU-FINAL.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raschet-KU-FINAL
          path: Raschet-KU-FINAL.apk
          if-no-files-found: error
          retention-days: 7
