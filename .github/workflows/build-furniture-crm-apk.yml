name: Build Furniture CRM APK

on:
  push:
    branches: [ furniture-crm-android-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Unpack Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q furniture-crm-android.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/FurnitureInstallerCRM-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureInstallerCRM-APK
          path: build-src/FurnitureInstallerCRM-Android/app/build/outputs/apk/debug/app-debug.apk
