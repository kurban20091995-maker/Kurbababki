name: Build Saldo APK

on:
  push:
    branches: [saldo-build-20260901]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Saldo source archive
        shell: bash
        run: |
          cat saldo-build-payload/part_* > saldo-source.b64
          base64 --decode saldo-source.b64 > Saldo-source.zip
          unzip -t Saldo-source.zip
          unzip -q Saldo-source.zip
          test -f Saldo/settings.gradle.kts
          test -f Saldo/app/build.gradle.kts

      - name: Apply verified source fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('Saldo/app/src/main/java/com/saldo/app/ui/Screens.kt')
          lines = p.read_text().splitlines()

          theme_marker = 'Row { ThemeMode.entries.forEach { mode -> IconButton(onClick = { viewModel.setTheme(mode) })'
          indexes = [i for i, line in enumerate(lines) if theme_marker in line]
          if len(indexes) != 1:
              raise SystemExit(f'Expected exactly one theme row, got {len(indexes)}')
          i = indexes[0]
          lines.insert(i + 1, '                    }')

          settings_marker = 'val settings by viewModel.settings.collectAsStateWithLifecycle()'
          debt_start = next(i for i, line in enumerate(lines) if 'private fun DebtDetailScreen' in line)
          settings_i = next(i for i in range(debt_start, min(debt_start + 20, len(lines))) if settings_marker in lines[i])
          lines.insert(settings_i + 1, '    val context = LocalContext.current')

          for i in range(debt_start, min(debt_start + 80, len(lines))):
              if 'pickDate(LocalContext.current, d.dueDate ?: System.currentTimeMillis())' in lines[i]:
                  lines[i] = lines[i].replace('pickDate(LocalContext.current, d.dueDate ?: System.currentTimeMillis())', 'pickDate(context, d.dueDate ?: System.currentTimeMillis())')
                  break
          else:
              raise SystemExit('Debt date picker source block not found')

          p.write_text('\n'.join(lines) + '\n')

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android lint
        working-directory: Saldo
        run: gradle lintDebug --stacktrace

      - name: Unit tests
        working-directory: Saldo
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: Saldo
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-debug-apk
          path: Saldo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
