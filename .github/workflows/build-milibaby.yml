name: Build MiliBaby APK

on:
  push:
    branches: [ "milbaby-apk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode project
        run: |
          mkdir -p milibaby-workdir
          cat milibaby_chunks/*.b64 > /tmp/milibaby.b64
          test "$(wc -c < /tmp/milibaby.b64)" -eq 30508
          base64 --decode /tmp/milibaby.b64 > /tmp/milibaby.tar.gz
          tar -xzf /tmp/milibaby.tar.gz -C milibaby-workdir
          test -f milibaby-workdir/settings.gradle
          test -f milibaby-workdir/app/build.gradle
          sed -i 's/setMinimumHeight(dp(220));/setMinimumHeight((int) dp(220));/' milibaby-workdir/app/src/main/java/com/milibaby/app/FeedingChartView.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('milibaby-workdir/app/src/main/java/com/milibaby/app/MainActivity.java')
          s=p.read_text()
          s=s.replace('t.setTypeface(null,i==currentTab?1:0);','t.setTypeface(null,i==currentTab?android.graphics.Typeface.BOLD:android.graphics.Typeface.NORMAL);')
          s=s.replace('if(bold)t.setTypeface(null,1);','if(bold)t.setTypeface(null,android.graphics.Typeface.BOLD);')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests, lint and APK build
        working-directory: milibaby-workdir
        run: gradle clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare deliverables
        run: |
          cp milibaby-workdir/app/build/outputs/apk/debug/app-debug.apk MiliBaby.apk
          cd milibaby-workdir
          zip -qr ../MiliBabyProject.zip . -x "app/build/*" -x ".gradle/*"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiliBaby-APK
          path: MiliBaby.apk
          if-no-files-found: error

      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: MiliBaby-Project
          path: MiliBabyProject.zip
          if-no-files-found: error
