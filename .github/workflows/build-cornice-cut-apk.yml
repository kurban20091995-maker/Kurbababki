name: Build Cornice Cut Optimizer APK

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Raskroy-Karniza-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raskroy-Karniza-v2-APK
          path: Raskroy-Karniza-v2.apk
          if-no-files-found: error
