name: Build Cornice Cut Optimizer APK

on:
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.issue.title == 'build-cornice-apk'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Raskroy-Karniza.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raskroy-Karniza-APK
          path: Raskroy-Karniza.apk
          if-no-files-found: error
